name: Project video download
run-name: download:${{ inputs.job_id }}
on:
  workflow_dispatch:
    inputs:
      job_id:
        description: Existing website download job UUID
        required: true
        type: string
permissions:
  contents: read
  id-token: write
jobs:
  download:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    concurrency:
      group: download-${{ inputs.job_id }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Install FFmpeg and downloader
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y ffmpeg
          python3 -m venv "$RUNNER_TEMP/downloader-venv"
          "$RUNNER_TEMP/downloader-venv/bin/pip" install 'yt-dlp[default]==2026.8.19'
      - name: Process website job and return video to storage
        env:
          MEDIA_JOB_ID: ${{ inputs.job_id }}
          MEDIA_WORKER_ORIGIN: ${{ vars.MEDIA_WORKER_ORIGIN }}
        run: '"$RUNNER_TEMP/downloader-venv/bin/python" scripts/github-download-runner.py'
